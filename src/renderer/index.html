<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>面试熔炉</title>
    <style>
      html, body, #app { height: 100%; margin: 0 }
      body { background: #f6f8fa; color: #1f2328; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif }
      #boot { position: fixed; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center }
      #boot b { font-size: 20px; letter-spacing: 1px }
      #boot span { color: #656d76; font-size: 13px }
      .bar { width: 220px; height: 4px; border-radius: 2px; background: #d0d7de; overflow: hidden; margin: 0 auto }
      .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #0969da, #1a7f37); animation: slide 1.1s infinite }
      @keyframes slide { 0% { transform: translateX(-100%) } 100% { transform: translateX(320%) } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot">
        <b>面试熔炉</b>
        <span>正在装载题库与学习进度…</span>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
